services:
  - type: web
    name: ai-studio-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    maxShutdownDelaySeconds: 300
    envVars:
      - key: AGNES_API_KEY
        sync: false
      - key: AGNES_RATE_LIMIT
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
