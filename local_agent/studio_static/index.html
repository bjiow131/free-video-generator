<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blender AI Agent — Студия</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">▶</span><div><strong>Blender AI Agent</strong><small>ВАША AI-СТУДИЯ ДЛЯ СОЗДАНИЯ ВИДЕО</small></div></div>
    <div class="project-control"><span>▣</span><input id="projectTitle" maxlength="180" aria-label="Название проекта" placeholder="Название проекта"><span class="chevron">⌄</span></div>
    <div class="top-actions"><span id="savedStatus" class="save-state">● Подключение…</span><span class="offline-pill">● Локально · без облака</span><button id="helpButton" class="icon-button" title="Справка">?</button></div>
  </header>
  <aside class="sidebar"><div class="nav-list" id="navigation"></div><div class="sidebar-bottom"><div class="system-card"><span class="online-dot"></span><div><b>Blender AI Agent</b><small>Локальная студия · Windows</small></div></div></div></aside>
  <main class="main" id="main"><div class="loading">Загрузка проекта…</div></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>
</div>
</body>
</html>
