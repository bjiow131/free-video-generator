name: Server Test

# Keep one verification run per PR/ref. New commits must not interrupt a run
# that has already started; GitHub may keep only the newest pending run queued.
concurrency:
  group: server-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

on:
  pull_request:
    paths:
      - "server.py"
      - "requirements.txt"
      - "core/**"
      - "models/**"
      - "local_agent/**"
      - "static/**"
      - "tests/**"
      - "start_windows.bat"
      - "Dockerfile"
      - "README.md"
      - ".github/workflows/server-test.yml"
  push:
    branches: [main]
    paths:
      - "server.py"
      - "requirements.txt"
      - "core/**"
      - "models/**"
      - "local_agent/**"
      - "static/**"
      - "tests/**"
      - "start_windows.bat"
      - "Dockerfile"
      - "README.md"
      - ".github/workflows/server-test.yml"
  workflow_dispatch:

jobs:
  verify:
    name: Sequential verification
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout source
        id: checkout
        uses: actions/checkout@v4

      - name: 2. Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Install application dependencies
        id: dependencies
        run: python -m pip install -r requirements.txt

      - name: 4. Static Python compilation
        id: compile
        run: python -m compileall -q server.py core models local_agent

      - name: 5. Import application entry point
        id: import_app
        run: python -c "from server import app; print(app.title)"

      - name: 6. Install test runner
        id: pytest_install
        run: python -m pip install pytest

      - name: 7. Core, recovery and security regression tests
        id: tests
        run: python -m pytest -q tests

      - name: 8. Build Docker image
        id: docker
        run: docker build --tag agnes-video-generator:ci .

      - name: 9. Validate web UI JavaScript syntax
        id: web_ui
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("static/ai-studio.html").read_text(encoding="utf-8")
          scripts = html.split("<script>")
          if len(scripts) < 2:
              raise SystemExit("No inline script found in ai-studio.html")
          js = scripts[-1].split("</script>", 1)[0]
          Path("/tmp/ai-studio.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/ai-studio.js

      - name: 10. Validate Windows launcher contract
        id: windows_launcher
        run: |
          python - <<'PY'
          from pathlib import Path

          bat = Path("start_windows.bat").read_text(encoding="utf-8")
          required = [
              '.venv\\Scripts\\python.exe',
              'server.py',
              'where ffmpeg',
          ]
          missing = [item for item in required if item not in bat]
          if missing:
              raise SystemExit(f"Windows launcher missing: {missing}")
          PY

      - name: 11. Write verification summary
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          PYTHON_SETUP: ${{ steps.python.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          APP_IMPORT: ${{ steps.import_app.outcome }}
          PYTEST_INSTALL: ${{ steps.pytest_install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          DOCKER: ${{ steps.docker.outcome }}
          WEB_UI: ${{ steps.web_ui.outcome }}
          WINDOWS_LAUNCHER: ${{ steps.windows_launcher.outcome }}
        run: |
          {
            echo "## Sequential verification report"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Checkout | $CHECKOUT |"
            echo "| Python setup | $PYTHON_SETUP |"
            echo "| Dependencies | $DEPENDENCIES |"
            echo "| Python compilation | $COMPILE |"
            echo "| Application import | $APP_IMPORT |"
            echo "| Test runner install | $PYTEST_INSTALL |"
            echo "| Regression tests | $TESTS |"
            echo "| Docker build | $DOCKER |"
            echo "| Web UI syntax | $WEB_UI |"
            echo "| Windows launcher contract | $WINDOWS_LAUNCHER |"
            echo
            echo "This workflow checks the Linux CI environment. It does not replace runtime verification on Windows or real FFmpeg/media fixtures."
          } >> "$GITHUB_STEP_SUMMARY"
