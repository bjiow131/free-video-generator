name: Server Test

on:
  push:
    paths:
      - "server.py"
      - "requirements.txt"
      - "core/**"
      - "models/**"
      - "local_agent/**"
      - "static/**"
      - "tests/**"
      - "start_windows.bat"
      - "Dockerfile"
      - "README.md"
      - ".github/workflows/server-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q server.py core models local_agent
      - name: Import FastAPI app
        run: python -c "from server import app; print(app.title)"
      - name: Install test runner
        run: pip install pytest
      - name: Run unit tests
        run: python -m pytest -q tests
      - name: Build Docker image
        run: docker build --tag agnes-video-generator:ci .
      - name: Validate web UI
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("static/ai-studio.html").read_text(encoding="utf-8")
          scripts = html.split("<script>")
          if len(scripts) < 2:
              raise SystemExit("No inline script found in ai-studio.html")
          js = scripts[-1].split("</script>", 1)[0]
          Path("/tmp/ai-studio.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/ai-studio.js
      - name: Validate Windows launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          bat = Path("start_windows.bat").read_text(encoding="utf-8")
          required = [
              '.venv\\Scripts\\python.exe',
              'server.py',
              'where ffmpeg',
          ]
          missing = [item for item in required if item not in bat]
          if missing:
              raise SystemExit(f"Windows launcher missing: {missing}")
          PY
