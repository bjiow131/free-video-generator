name: Blender AI Agent — Windows regression

# This workflow validates ONLY the local Blender agent. The legacy API/UI
# remains in this repository but is unrelated and must never be run here.
on:
  pull_request:
    branches:
      - feature/local-video-agent
      - feature/local-first-migration
      - blender-agent-repair
      - feature/enable-github-mailbox
      - feature/chatgpt-repair-channel
    paths:
      - "local_agent/**"
      - "tests/test_mia_render_duplicate_guard.py"
      - "tests/test_blender_*.py"
      - "tests/test_local_agent_*.py"
      - "tests/test_local_project_runner.py"
      - "tests/test_checkpoint_schema.py"
      - "tests/test_ffmpeg_media.py"
      - "tests/test_github_queue.py"
      - "tests/test_repair_channel.py"
      - "tests/test_patch_validation.py"
      - "tests/test_repair_replay.py"
      - "tests/test_poller*.py"
      - "tests/test_result_outbox.py"
      - "tests/test_story_plan.py"
      - "tests/test_scene_compiler.py"
      - "tests/test_asset_registry.py"
      - "tests/test_preflight.py"
      - "tests/test_dialogue_cues.py"
      - "tests/test_notifications.py"
      - "tests/test_error_knowledge.py"
      - "tests/test_manifest_security.py"
      - "tests/test_control_protocol.py"
      - "requirements-local-agent.txt"
      - "requirements-github-mailbox.txt"
      - "scripts/windows/**"
      - "setup_blender_agent.bat"
      - "run_blender_agent.bat"
      - ".github/workflows/local-agent-tests.yml"
  push:
    branches:
      - feature/local-first-migration
      - audit/repair-channel-hardening-20261011
      - fix/mia-render-duplicate-source-first-20261014
    paths:
      - "local_agent/**"
      - "tests/test_blender_*.py"
      - "tests/test_local_agent_*.py"
      - "tests/test_local_project_runner.py"
      - "tests/test_poller*.py"
      - "requirements-local-agent.txt"
      - "requirements-github-mailbox.txt"
      - "scripts/windows/**"
      - "setup_blender_agent.bat"
      - "run_blender_agent.bat"
      - ".github/workflows/local-agent-tests.yml"
  workflow_dispatch:

concurrency:
  group: blender-agent-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-blender-agent:
    name: Windows — complete Blender agent suite
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out agent sources
        uses: actions/checkout@v4
      - name: Use Windows Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender-agent test dependencies only
        run: python -m pip install --disable-pip-version-check -r requirements-github-mailbox.txt
      - name: Compile local agent and mailbox checker only
        run: python -m compileall -q local_agent scripts/check_github_connection.py
      - name: Run complete local Blender-agent tests (no cloud API or web app)
        timeout-minutes: 10
        run: python -m local_agent.test_scope all

  portable-security:
    name: Portable security contracts (supplemental)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out agent sources
        uses: actions/checkout@v4
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Blender-agent test dependencies only
        run: python -m pip install --disable-pip-version-check -r requirements-github-mailbox.txt
      - name: Compile agent-only Python sources
        run: python -m compileall -q local_agent scripts/check_github_connection.py
      - name: Run portable mailbox and repair protocol security tests
        timeout-minutes: 4
        run: python -m local_agent.test_scope security
