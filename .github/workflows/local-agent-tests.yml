name: Local agent safety tests

on:
  pull_request:
    branches:
      - feature/local-video-agent
    paths:
      - "local_agent/**"
      - "tests/test_blender_bridge.py"
      - "tests/test_control_protocol.py"
      - "tests/test_poller.py"
      - "tests/test_github_queue.py"
      - "tests/test_local_agent_attachments.py"
      - "tests/test_story_plan.py"
      - "tests/test_scene_compiler.py"
      - "tests/test_asset_registry.py"
      - "tests/test_preflight.py"
      - "tests/test_notifications.py"
      - "requirements-local-agent.txt"
      - ".github/workflows/local-agent-tests.yml"
  push:
    branches:
      - feature/local-first-migration
    paths:
      - "local_agent/**"
      - "tests/test_blender_bridge.py"
      - "tests/test_control_protocol.py"
      - "tests/test_poller.py"
      - "tests/test_github_queue.py"
      - "tests/test_local_agent_attachments.py"
      - "tests/test_story_plan.py"
      - "tests/test_scene_compiler.py"
      - "tests/test_asset_registry.py"
      - "requirements-local-agent.txt"
      - ".github/workflows/local-agent-tests.yml"

permissions:
  contents: read

jobs:
  local-agent-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-local-agent.txt
      - name: Run local-agent safety tests
        run: python -m pytest -q tests/test_blender_bridge.py tests/test_control_protocol.py tests/test_poller.py tests/test_github_queue.py tests/test_local_agent_attachments.py tests/test_story_plan.py tests/test_scene_compiler.py tests/test_asset_registry.py tests/test_preflight.py tests/test_notifications.py
