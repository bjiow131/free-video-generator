name: Local agent safety tests

on:
  pull_request:
    branches:
      - feature/local-video-agent
      - feature/local-first-migration
      - blender-agent-repair
      - blender-agent-capabilities
      - feature/character-library-ui
    paths:
      - "local_agent/**"
      - "tests/test_blender_bridge.py"
      - "tests/test_control_protocol.py"
      - "tests/test_poller.py"
      - "tests/test_poller_delivery_state.py"
      - "tests/test_result_outbox.py"
      - "tests/test_local_project_runner.py"
      - "tests/test_checkpoint_schema.py"
      - "tests/test_ffmpeg_media.py"
      - "tests/test_github_queue.py"
      - "tests/test_local_agent_attachments.py"
      - "tests/test_story_plan.py"
      - "tests/test_scene_compiler.py"
      - "tests/test_asset_registry.py"
      - "tests/test_preflight.py"
      - "tests/test_notifications.py"
      - "tests/test_workbench_cli.py"
      - "tests/test_scene_request.py"
      - "tests/test_agent_desktop.py"
      - "tests/test_character_library.py"
      - "tests/test_scene01_reference_pack.py"
      - "tests/test_season1_library_package.py"
      - "requirements-local-agent.txt"
      - "scripts/windows/**"
      - "setup_blender_agent.bat"
      - "run_blender_agent.bat"
      - ".github/workflows/local-agent-tests.yml"
  push:
    branches:
      - feature/local-first-migration
      - feature/character-library-ui
    paths:
      - "local_agent/**"
      - "tests/test_blender_bridge.py"
      - "tests/test_control_protocol.py"
      - "tests/test_poller.py"
      - "tests/test_poller_delivery_state.py"
      - "tests/test_result_outbox.py"
      - "tests/test_local_project_runner.py"
      - "tests/test_checkpoint_schema.py"
      - "tests/test_ffmpeg_media.py"
      - "tests/test_github_queue.py"
      - "tests/test_local_agent_attachments.py"
      - "tests/test_story_plan.py"
      - "tests/test_scene_compiler.py"
      - "tests/test_asset_registry.py"
      - "requirements-local-agent.txt"
      - "scripts/windows/**"
      - ".github/workflows/local-agent-tests.yml"

concurrency:
  group: local-agent-safety-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  local-agent-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-local-agent.txt
      - name: Run local-agent safety tests
        run: python -m pytest -q tests/test_blender_bridge.py tests/test_control_protocol.py tests/test_poller.py tests/test_poller_delivery_state.py tests/test_result_outbox.py tests/test_local_project_runner.py tests/test_checkpoint_schema.py tests/test_ffmpeg_media.py tests/test_github_queue.py tests/test_local_agent_attachments.py tests/test_story_plan.py tests/test_scene_compiler.py tests/test_asset_registry.py tests/test_preflight.py tests/test_notifications.py tests/test_workbench_cli.py tests/test_scene_request.py tests/test_agent_desktop.py tests/test_character_library.py tests/test_scene01_reference_pack.py tests/test_season1_library_package.py
