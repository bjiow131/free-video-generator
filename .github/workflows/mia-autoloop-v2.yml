name: Mia Astra 100 V2 verified
on:
  push:
    branches: [feature/mia-astra-autoloop-v2-multiview-20261013]
    paths:
      - 'local_agent/blender_workflow.py'
      - 'local_agent/poller.py'
      - 'local_agent/control_protocol.py'
      - 'local_agent/mailbox_policy.py'
      - 'tests/test_mia_autoloop_v2.py'
      - '.github/workflows/mia-autoloop-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-github-mailbox.txt
      - run: python -m compileall -q local_agent
      - run: python -m pytest -q tests/test_mia_autoloop_v2.py tests/test_mia_autoloop_100.py tests/test_control_protocol.py tests/test_mailbox_policy.py tests/test_mailbox_idle_alerts.py
