name: OctavAPI memory — trusted updater release

on:
  push:
    branches:
      - release/octava-memory-trusted-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-memory:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-github-mailbox.txt
      - name: Compile all local agent modules
        run: python -m compileall -q local_agent
      - name: OctavAPI and portable memory regression
        run: python -m unittest discover -s tests -p "test_octava_*.py" -v
      - name: Trusted updater and unattended worker regression
        run: python -m pytest -q tests/test_trusted_updates.py tests/test_unattended_poller.py

  portable-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-github-mailbox.txt
      - run: python -m compileall -q local_agent
      - run: python -m unittest discover -s tests -p "test_octava_*.py" -v
