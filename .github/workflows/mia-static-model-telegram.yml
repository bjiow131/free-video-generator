name: Mia static 3D model and delivery

on:
  push:
    branches: [feature/mia-static-model-telegram-20261013]
    paths:
      - "local_agent/control_protocol.py"
      - "local_agent/mailbox_policy.py"
      - "local_agent/poller.py"
      - "local_agent/studio_server.py"
      - "tests/test_mailbox_idle_alerts.py"
      - "tests/test_mia_model_review_delivery.py"
      - ".github/workflows/mia-static-model-telegram.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-mia:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install -r requirements-github-mailbox.txt
      - name: Compile
        run: python -m compileall -q local_agent
      - name: Runtime, Telegram and mailbox tests
        run: python -m pytest -q tests/test_mia_model_review_delivery.py tests/test_mailbox_idle_alerts.py tests/test_trusted_updates.py tests/test_mailbox_policy.py tests/test_octava_mailbox.py tests/test_control_protocol.py tests/test_unattended_poller.py tests/test_telegram_notification_switch.py
