name: OctavAPI Windows connectivity diagnostics

on:
  push:
    branches:
      - fix/octava-windows-network-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-github-mailbox.txt
      - run: python -m compileall -q local_agent
      - run: python -m unittest discover -s tests -p "test_octava_*.py" -v
      - run: python -m pytest -q tests/test_trusted_updates.py tests/test_unattended_poller.py
      - name: Verify pinned update SHA256
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          files = ["local_agent/poller.py", "local_agent/control_protocol.py", "local_agent/mailbox_policy.py"]
          print("OCTAVA_NET_SHA256=" + json.dumps({p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}, sort_keys=True))
