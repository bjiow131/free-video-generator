name: Agnes Video Generator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Video prompt"
        required: true
        type: string
      seconds:
        description: "Duration (4-12 seconds)"
        required: false
        default: "10"
        type: string
      aspect_ratio:
        description: "Aspect ratio"
        required: false
        default: "9:16"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate video with Agnes AI
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_SECONDS: ${{ inputs.seconds }}
          VIDEO_ASPECT: ${{ inputs.aspect_ratio }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, os

          key = os.environ.get("AGNES_API_KEY")
          if not key:
              raise SystemExit("Missing AGNES_API_KEY GitHub secret.")

          try:
              seconds = int(os.environ.get("VIDEO_SECONDS", "10"))
          except ValueError:
              raise SystemExit("seconds must be an integer from 4 to 12")
          if not 4 <= seconds <= 12:
              raise SystemExit("seconds must be between 4 and 12")

          aspect = os.environ.get("VIDEO_ASPECT", "9:16")
          allowed = {"16:9", "9:16", "1:1", "4:3", "3:4", "21:9"}
          if aspect not in allowed:
              raise SystemExit(f"Unsupported aspect_ratio: {aspect}")

          payload = {
              "model": "agnes-video-2.5-flash",
              "prompt": os.environ["VIDEO_PROMPT"],
              "mode": "text",
              "seconds": str(seconds),
              "size": "720P",
              "aspect_ratio": aspect,
              "n": 1
          }
          with open("agnes-request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))

          print("Submitting video generation...")
          PY

          response=$(curl --fail-with-body --silent --show-error             --request POST "https://apihub.agnes-ai.com/v1/videos"             --header "Authorization: Bearer $AGNES_API_KEY"             --header "Content-Type: application/json"             --data-binary @agnes-request.json)

          printf '%s
' "$response" | python -m json.tool

          video_id=$(printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("video_id") or d.get("task_id") or d.get("id") or "")')
          if [ -z "$video_id" ]; then
            echo "Agnes API did not return a video_id/task_id/id."
            exit 1
          fi

          echo "Video ID: $video_id"

          for attempt in $(seq 1 180); do
            sleep 10
            poll_url="https://apihub.agnes-ai.com/agnesapi?video_id=$video_id&model_name=agnes-video-2.5-flash"
            status=$(curl --fail-with-body --silent --show-error               --request GET "$poll_url"               --header "Authorization: Bearer $AGNES_API_KEY") || {
                echo "Polling request failed; retrying..."
                continue
              }

            state=$(printf '%s' "$status" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",""))')
            progress=$(printf '%s' "$status" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("progress",0))')
            echo "Status: $state, progress: $progress%"

            if [ "$state" = "completed" ]; then
              video_url=$(printf '%s' "$status" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("url") or (d.get("metadata") or {}).get("url") or "")')
              if [ -z "$video_url" ]; then
                echo "Generation completed but no video URL was returned."
                printf '%s
' "$status"
                exit 1
              fi
              curl --fail --silent --show-error --location                 --output agnes-video.mp4 "$video_url"
              break
            fi

            if [ "$state" = "failed" ]; then
              printf '%s
' "$status"
              exit 1
            fi
          done

          test -s agnes-video.mp4
          echo "Saved agnes-video.mp4"

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: agnes-video
          path: agnes-video.mp4
          if-no-files-found: error
