name: Agnes Video Generator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Video prompt"
        required: true
        type: string
      seconds:
        description: "Duration (4-12 seconds)"
        required: true
        default: "10"
        type: string
      aspect_ratio:
        description: "Aspect ratio"
        required: true
        default: "9:16"
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate inputs
        env:
          VIDEO_SECONDS: ${{ inputs.seconds }}
          VIDEO_ASPECT: ${{ inputs.aspect_ratio }}
        run: |
          set -euo pipefail
          case "$VIDEO_SECONDS" in
            ''|*[!0-9]*) echo "seconds must be an integer from 4 to 12"; exit 1 ;;
          esac
          if [ "$VIDEO_SECONDS" -lt 4 ] || [ "$VIDEO_SECONDS" -gt 12 ]; then
            echo "seconds must be between 4 and 12"
            exit 1
          fi
          case "$VIDEO_ASPECT" in
            16:9|9:16|1:1|4:3|3:4|21:9) ;;
            *) echo "Unsupported aspect_ratio: $VIDEO_ASPECT"; exit 1 ;;
          esac

      - name: Create Agnes request
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_SECONDS: ${{ inputs.seconds }}
          VIDEO_ASPECT: ${{ inputs.aspect_ratio }}
        run: |
          set -euo pipefail

          if [ -z "$AGNES_API_KEY" ]; then
            echo "Missing AGNES_API_KEY GitHub secret."
            exit 1
          fi

          python - <<'PY'
          import json, os
          payload = {
              "model": "agnes-video-2.5-flash",
              "prompt": os.environ["VIDEO_PROMPT"],
              "mode": "text",
              "seconds": str(int(os.environ["VIDEO_SECONDS"])),
              "size": "720P",
              "aspect_ratio": os.environ["VIDEO_ASPECT"],
              "n": 1,
          }
          with open("agnes-request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))
          print("Request prepared.")
          PY

      - name: Submit generation
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -euo pipefail

          max_attempts=24
          response=""
          http_code=""

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Submitting generation request (attempt $attempt/$max_attempts)..."

            tmp_body="$(mktemp)"
            http_code="$(curl --silent --show-error --location               --request POST "https://apihub.agnes-ai.com/v1/videos"               --header "Authorization: Bearer $AGNES_API_KEY"               --header "Content-Type: application/json"               --output "$tmp_body"               --write-out "%{http_code}"               --data-binary @agnes-request.json || true)"

            response="$(cat "$tmp_body")"
            rm -f "$tmp_body"

            case "$http_code" in
              200|201|202)
                break
                ;;
              429|500|502|503|504)
                if [ "$attempt" -lt "$max_attempts" ]; then
                  error_code="$(printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("code",""))' 2>/dev/null || true)"

                  if [ "$error_code" = "video_queue_full" ]; then
                    retry_after=60
                    echo "Agnes video queue is full. Waiting ${retry_after}s before retrying..."
                  else
                    retry_after=$((30 * 2 ** (attempt - 1)))
                    if [ "$retry_after" -gt 120 ]; then
                      retry_after=120
                    fi
                    echo "Agnes API returned HTTP $http_code. Retrying in ${retry_after}s..."
                  fi

                  sleep "$retry_after"
                  continue
                fi

                echo "Agnes API remained unavailable after $max_attempts attempts."
                printf '%s\n' "$response"
                exit 1
                ;;
              *)
                echo "Agnes API returned unexpected HTTP $http_code."
                printf '%s\n' "$response"
                exit 1
                ;;
            esac
          done

          printf '%s\n' "$response" | python -m json.tool

          video_id="$(printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("video_id") or d.get("task_id") or d.get("id") or "")')"
          if [ -z "$video_id" ]; then
            echo "Agnes API did not return a video ID."
            exit 1
          fi
          echo "VIDEO_ID=$video_id" >> "$GITHUB_ENV"
          echo "Video ID: $video_id"

      - name: Wait for video
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          set -euo pipefail
          completed=0
          started_at=$(date +%s)

          echo "Generation started. Progress will be updated every 5 seconds."

          for attempt in $(seq 1 360); do
            sleep 5
            status_response="$(curl --fail-with-body --silent --show-error \
              --request GET \
              "https://apihub.agnes-ai.com/agnesapi?video_id=$VIDEO_ID&model_name=agnes-video-2.5-flash" \
              --header "Authorization: Bearer $AGNES_API_KEY")"

            state="$(printf '%s' "$status_response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",""))')"
            progress="$(printf '%s' "$status_response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("progress",0))')"

            if ! [[ "$progress" =~ ^[0-9]+$ ]]; then
              progress=0
            fi
            if [ "$progress" -gt 100 ]; then
              progress=100
            fi

            elapsed=$(( $(date +%s) - started_at ))
            minutes=$((elapsed / 60))
            seconds=$((elapsed % 60))

            bar_length=30
            filled=$((progress * bar_length / 100))
            empty=$((bar_length - filled))
            bar="$(printf '%*s' "$filled" '' | tr ' ' '#')$(printf '%*s' "$empty" '' | tr ' ' '-')"

            echo "[$bar] $progress% | status: $state | elapsed: ${minutes}m ${seconds}s"

            case "$state" in
              completed)
                video_url="$(printf '%s' "$status_response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("url") or (d.get("metadata") or {}).get("url") or "")')"
                if [ -z "$video_url" ]; then
                  echo "Generation completed but no video URL was returned."
                  printf '%s\n' "$status_response"
                  exit 1
                fi
                echo "VIDEO_URL=$video_url" >> "$GITHUB_ENV"
                echo "Generation completed: 100%"
                completed=1
                break
                ;;
              failed|error|cancelled)
                echo "Agnes generation failed:"
                printf '%s\n' "$status_response"
                exit 1
                ;;
            esac
          done

          if [ "$completed" -ne 1 ]; then
            echo "Timed out waiting for Agnes generation."
            exit 1
          fi

      - name: Download video
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             --output agnes-video.mp4 "$VIDEO_URL"
          test -s agnes-video.mp4
          file agnes-video.mp4 || true
          echo "Saved agnes-video.mp4"

      - name: Publish video to repository
        env:
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_SECONDS: ${{ inputs.seconds }}
          VIDEO_ASPECT: ${{ inputs.aspect_ratio }}
        run: |
          set -euo pipefail

          output_dir="generated-videos/${GITHUB_RUN_ID}"
          mkdir -p "$output_dir"
          cp agnes-video.mp4 "$output_dir/agnes-video.mp4"

          cat > "$output_dir/video-metadata.txt" <<EOF
          model=agnes-video-2.5-flash
          seconds=$VIDEO_SECONDS
          aspect_ratio=$VIDEO_ASPECT
          prompt=$VIDEO_PROMPT
          generated_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          run_id=$GITHUB_RUN_ID
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output_dir"
          git commit -m "Add generated video ${GITHUB_RUN_ID}"
          git push origin main

          echo "DIRECT_VIDEO_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${output_dir}/agnes-video.mp4"
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: agnes-video
          path: agnes-video.mp4
          if-no-files-found: error
