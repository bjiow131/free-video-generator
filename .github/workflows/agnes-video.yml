name: Agnes Video Generator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Video prompt"
        required: true
        type: string
      seconds:
        description: "Duration (4-12 seconds)"
        required: false
        default: "10"
        type: string
      aspect_ratio:
        description: "Aspect ratio"
        required: false
        default: "9:16"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate video with Agnes AI
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_SECONDS: ${{ inputs.seconds }}
          VIDEO_ASPECT: ${{ inputs.aspect_ratio }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error, urllib.parse

          key = os.environ.get("AGNES_API_KEY")
          if not key:
              raise SystemExit("Missing AGNES_API_KEY GitHub secret.")

          prompt = os.environ["VIDEO_PROMPT"]
          try:
              seconds = int(os.environ.get("VIDEO_SECONDS", "10"))
          except ValueError:
              raise SystemExit("seconds must be an integer from 4 to 12")
          if not 4 <= seconds <= 12:
              raise SystemExit("seconds must be between 4 and 12")

          aspect = os.environ.get("VIDEO_ASPECT", "9:16")
          allowed = {"16:9", "9:16", "1:1", "4:3", "3:4", "21:9"}
          if aspect not in allowed:
              raise SystemExit(f"Unsupported aspect_ratio: {aspect}")

          base = "https://apihub.agnes-ai.com"
          headers = {
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
          }

          payload = {
              "model": "agnes-video-2.5-flash",
              "prompt": prompt,
              "mode": "text",
              "seconds": seconds,
              "size": "720P",
              "aspect_ratio": aspect,
              "n": 1,
          }

          req = urllib.request.Request(
              base + "/v1/videos",
              data=json.dumps(payload).encode(),
              headers=headers,
              method="POST",
          )

          print("Submitting video generation...")
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.load(r)
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              raise SystemExit(f"Agnes API HTTP {e.code}: {body[:2000]}")

          print(json.dumps(result, indent=2))
          video_id = result.get("video_id") or result.get("task_id") or result.get("id")
          if not video_id:
              raise SystemExit("Agnes API did not return a video_id/task_id/id.")

          print(f"Video ID: {video_id}")

          for attempt in range(180):
              time.sleep(10)
              url = f"{base}/agnesapi?video_id={urllib.parse.quote(video_id)}&model_name=agnes-video-2.5-flash"
              poll = urllib.request.Request(url, headers={"Authorization": f"Bearer {key}"})
              try:
                  with urllib.request.urlopen(poll, timeout=30) as r:
                      status = json.load(r)
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors="replace")
                  print(f"Poll HTTP {e.code}: {body[:500]}")
                  continue

              state = status.get("status", "")
              progress = status.get("progress", 0)
              print(f"Status: {state}, progress: {progress}%")

              if state.lower() == "completed":
                  video_url = status.get("url") or status.get("video_url")
                  if not video_url:
                      data = status.get("data") or {}
                      video_url = data.get("url") or data.get("video_url") if isinstance(data, dict) else None
                  if not video_url:
                      raise SystemExit("Generation completed but no video URL was returned.")
                  print(f"Video URL received.")
                  urllib.request.urlretrieve(video_url, "agnes-video.mp4")
                  break

              if state.lower() == "failed":
                  raise SystemExit(f"Agnes generation failed: {status.get('error', 'unknown error')}")
          else:
              raise SystemExit("Timed out waiting for Agnes video generation.")

          print("Saved agnes-video.mp4")
          PY

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: agnes-video
          path: agnes-video.mp4
          if-no-files-found: error
