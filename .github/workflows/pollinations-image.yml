name: Pollinations Image Generator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Image prompt"
        required: true
        type: string
      model:
        description: "Image model"
        required: true
        default: "flux"
        type: choice
        options: [flux, zimage, qwen-image, seedream5, nanobanana, gptimage, gptimage-large, wan-image, klein, nova-canvas]
      aspect_ratio:
        description: "Aspect ratio"
        required: true
        default: "9:16"
        type: choice
        options: ["9:16", "16:9", "1:1", "4:3", "3:4"]
      resolution:
        description: "Base resolution"
        required: true
        default: "1024"
        type: choice
        options: ["1024", "1536", "2048"]
      quality:
        description: "Quality"
        required: true
        default: "high"
        type: choice
        options: ["low", "medium", "high", "hd"]
      variants:
        description: "Number of variants"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4"]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        env:
          IMAGE_MODEL: ${{ inputs.model }}
          IMAGE_ASPECT: ${{ inputs.aspect_ratio }}
          IMAGE_RESOLUTION: ${{ inputs.resolution }}
          IMAGE_QUALITY: ${{ inputs.quality }}
          IMAGE_VARIANTS: ${{ inputs.variants }}
        run: |
          set -euo pipefail
          case "$IMAGE_MODEL" in
            flux|zimage|qwen-image|seedream5|nanobanana|gptimage|gptimage-large|wan-image|klein|nova-canvas) ;;
            *) echo "Unsupported model: $IMAGE_MODEL"; exit 1 ;;
          esac
          case "$IMAGE_ASPECT" in
            9:16|16:9|1:1|4:3|3:4) ;;
            *) echo "Unsupported aspect ratio: $IMAGE_ASPECT"; exit 1 ;;
          esac
          case "$IMAGE_RESOLUTION" in
            1024|1536|2048) ;;
            *) echo "Unsupported resolution: $IMAGE_RESOLUTION"; exit 1 ;;
          esac
          case "$IMAGE_QUALITY" in
            low|medium|high|hd) ;;
            *) echo "Unsupported quality: $IMAGE_QUALITY"; exit 1 ;;
          esac
          case "$IMAGE_VARIANTS" in
            1|2|3|4) ;;
            *) echo "Unsupported variants count: $IMAGE_VARIANTS"; exit 1 ;;
          esac

      - name: Generate image variants
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          IMAGE_PROMPT: ${{ inputs.prompt }}
          IMAGE_MODEL: ${{ inputs.model }}
          IMAGE_ASPECT: ${{ inputs.aspect_ratio }}
        run: |
          set -euo pipefail
          if [ -z "$POLLINATIONS_API_KEY" ]; then
            echo "Missing POLLINATIONS_API_KEY GitHub secret."
            exit 1
          fi

          python - <<'PY'
          import os
          import urllib.parse

          prompt = os.environ["IMAGE_PROMPT"]
          aspect = os.environ["IMAGE_ASPECT"]
          base = int(os.environ["IMAGE_RESOLUTION"])
          quality = os.environ["IMAGE_QUALITY"]
          variants = int(os.environ["IMAGE_VARIANTS"])
          model = os.environ["IMAGE_MODEL"]

          ratios = {
              "1:1": (1, 1),
              "16:9": (16, 9),
              "9:16": (9, 16),
              "4:3": (4, 3),
              "3:4": (3, 4),
          }

          rw, rh = ratios[aspect]
          if rw >= rh:
              width = base
              height = round(base * rh / rw)
          else:
              height = base
              width = round(base * rw / rh)

          width = max(512, (width // 8) * 8)
          height = max(512, (height // 8) * 8)

          print(f"Model: {model}")
          print(f"Aspect: {aspect}")
          print(f"Dimensions: {width}x{height}")
          print(f"Quality: {quality}")
          print(f"Variants: {variants}")

          base_url = "https://gen.pollinations.ai/image/" + urllib.parse.quote(prompt, safe="")
          for i in range(1, variants + 1):
              params = {
                  "model": model,
                  "width": width,
                  "height": height,
                  "quality": quality,
                  "seed": i,
              }
              url = base_url + "?" + urllib.parse.urlencode(params)
              with open(f"pollinations-url-{i}.txt", "w", encoding="utf-8") as f:
                  f.write(url)
          PY

          for i in $(seq 1 "$IMAGE_VARIANTS"); do
            echo "Generating variant $i/$IMAGE_VARIANTS..."
            curl --fail --silent --show-error --location               --retry 4 --retry-delay 5 --retry-all-errors               --header "Authorization: Bearer $POLLINATIONS_API_KEY"               --output "generated-image-$i.jpg"               "$(cat "pollinations-url-$i.txt")"
            test -s "generated-image-$i.jpg"
            file "generated-image-$i.jpg"
          done

      - name: Save metadata
        env:
          IMAGE_MODEL: ${{ inputs.model }}
          IMAGE_ASPECT: ${{ inputs.aspect_ratio }}
          IMAGE_RESOLUTION: ${{ inputs.resolution }}
          IMAGE_QUALITY: ${{ inputs.quality }}
          IMAGE_VARIANTS: ${{ inputs.variants }}
          IMAGE_PROMPT: ${{ inputs.prompt }}
        run: |
          set -euo pipefail
          {
            printf 'model=%s\n' "$IMAGE_MODEL"
            printf 'aspect_ratio=%s\n' "$IMAGE_ASPECT"
            printf 'base_resolution=%s\n' "$IMAGE_RESOLUTION"
            printf 'quality=%s\n' "$IMAGE_QUALITY"
            printf 'variants=%s\n' "$IMAGE_VARIANTS"
            printf 'prompt=%s\n' "$IMAGE_PROMPT"
            printf 'generated_at=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } > image-metadata.txt

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pollinations-images
          path: |
            generated-image-*.jpg
            image-metadata.txt
          if-no-files-found: error
