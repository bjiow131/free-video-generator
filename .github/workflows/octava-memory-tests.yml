name: OctavAPI durable memory — isolated regression

on:
  push:
    branches:
      - feature/octava-durable-memory-20261012
      - feature/octava-sol-luna-routing-20261012
    paths:
      - "local_agent/octava_*.py"
      - "local_agent/control_protocol.py"
      - "local_agent/poller.py"
      - "local_agent/studio_server.py"
      - "tests/test_octava_*.py"
      - ".github/workflows/octava-memory-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  octava-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local agent dependencies
        run: python -m pip install -r requirements-github-mailbox.txt
      - name: Compile all changed modules
        run: python -m compileall -q local_agent
      - name: Run isolated OctavAPI regressions without network calls
        run: python -m unittest discover -s tests -p "test_octava_*.py" -v

  windows-memory:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local agent dependencies
        run: python -m pip install -r requirements-github-mailbox.txt
      - name: Compile modules
        run: python -m compileall -q local_agent
      - name: Run isolated OctavAPI regressions on Windows
        run: python -m unittest discover -s tests -p "test_octava_*.py" -v
